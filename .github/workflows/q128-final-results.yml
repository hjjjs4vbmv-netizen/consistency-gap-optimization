name: q128 final results verification
on:
  pull_request:
    paths:
      - 'analysis/q128_startup_fresh8_v1/**'
      - 'analysis/startup_window_experiments_v1/results/**'
      - '.github/workflows/q128-final-results.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-and-paired-statistics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.1.2 scipy==1.16.1
      - run: python analysis/q128_startup_fresh8_v1/verify_results.py
